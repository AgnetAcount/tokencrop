[package]
name = "tokencrop"
version = "0.1.0"
edition = "2021"
authors = ["Agnet Software Corp. <ceo@agnetsoftware.corp>"]
description = "Ultra-fast codebase context packer, comment stripper, and token optimizer for LLMs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AgnetAcount/tokencrop"
keywords = ["llm", "tokens", "ai-context", "code-packer", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
